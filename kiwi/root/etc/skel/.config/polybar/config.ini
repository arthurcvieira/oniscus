; Oniscus: bottom bar, a floating pill centered on screen.
; Only workspaces, CPU and RAM. Wifi and battery live in the top bar.
; Colors from the dark Xi3 Retro theme: slate, with the active workspace in yellow.

[colors]
background = #2A3038
foreground = #9AA4AF
value = #E6E9EC
accent = #F7C948
muted = #E6E9EC
divider = #3A424C
border = #3A424C

[bar/xi3]
bottom = true
width = 18%
height = 34
offset-x = 41%
offset-y = 14
; No radius or border here: picom rounds the pill (see picom.conf). Polybar's
; own corners left a dark box behind the bar.
override-redirect = true
wm-restack = i3
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin = 1
separator = " "
font-0 = Noto Sans:size=10;2
font-1 = Noto Sans:weight=bold:size=10;2
modules-center = i3 divider cpu memory
enable-ipc = true
cursor-click = pointer

[module/divider]
type = custom/text
format = |
format-foreground = ${colors.divider}

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = #121519
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = #F28C28
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %{T2}%{F#E6E9EC}%percentage%%%{F-}%{T-}

[module/memory]
type = internal/memory
interval = 3
label = RAM %{T2}%{F#E6E9EC}%gb_used%%{F-}%{T-}

[settings]
screenchange-reload = true
