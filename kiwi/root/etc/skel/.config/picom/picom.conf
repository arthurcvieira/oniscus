# Oniscus: compositor with animations for i3.
# The "animations" syntax needs picom 12 or newer.

# xrender works everywhere; glx left windows empty without GPU acceleration
# (virtual machines). Set "glx" for smoother animations on a real GPU.
backend = "xrender";
vsync = true;

# Soft shadows, like classic desktop windows
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -6;
shadow-opacity = 0.45;
shadow-exclude = [ "class_g = 'Polybar'", "window_type = 'dock'", "window_type = 'desktop'" ];

corner-radius = 6;
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'Xfce4-panel'" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.08;

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.22;
    scale = 0.92;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.16;
    scale = 0.92;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.2;
  }
);
