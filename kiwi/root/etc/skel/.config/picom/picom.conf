# Oniscus: compositor with animations for i3.
# The "animations" syntax needs picom 12 or newer.

# xrender works everywhere; glx left windows empty without GPU acceleration
# (virtual machines). Set "glx" for smoother animations on a real GPU.
backend = "xrender";
vsync = true;
# Repaint the whole screen each frame. With partial repaints, windows were
# sometimes left half drawn after opening (seen in virtual machines).
use-damage = false;

# Soft shadows, like classic desktop windows
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -6;
shadow-opacity = 0.45;
corner-radius = 6;

# Per-window exceptions (picom 12 "rules"; later entries win).
# Bars and the dock get no shadow and no window rounding. picom rounds the
# Polybar pill itself, since Polybar's own rounded corners came out as a dark
# box behind the bar.
rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Plank' || class_g = 'Xfce4-panel'";
    shadow = false; corner-radius = 0; },
  { match = "class_g = 'Polybar' || name *= 'polybar'";
    shadow = false; corner-radius = 17; }
);

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.08;

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.22;
    scale = 0.92;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.16;
    scale = 0.92;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.2;
  }
);
