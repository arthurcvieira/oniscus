# Oniscus: the Ly terminal greeter, in the brand colors.
# Colors use the 0xSSRRGGBB format (SS = style: 00 normal, 01 bold). Needs Ly 1.1 or newer.
# English is the default language; set lang = en for Portuguese.

lang = en

# Animated background: dark plasma in charcoal, shell brown and amber
animation = colormix
animation_timeout_sec = 0
colormix_col1 = 0x00121519
colormix_col2 = 0x004E3527
colormix_col3 = 0x00C99412

# Login box
box_title = Oniscus
fg = 0x00E6E9EC
bg = 0x00121519
border_fg = 0x00F7C948
error_fg = 0x01F28C28
error_bg = 0x00121519
margin_box_h = 3
margin_box_v = 2
input_len = 34
asterisk = •
clear_password = true
blank_box = true
hide_borders = false
hide_key_hints = false
text_in_center = false

# Big clock on top, plus the date
bigclock = en
clock = %a %d %b  %H:%M

initial_info_text = Oniscus live: user live, password live

# Remember the last user and session
save = true
load = true
default_input = login
numlock = false

# Only the Oniscus session (XFCE with i3) is listed.
# To offer plain i3 as well, point this to /usr/share/xsessions.
xsessions = /usr/share/oniscus/xsessions
waylandsessions = /usr/share/oniscus/wayland-sessions
