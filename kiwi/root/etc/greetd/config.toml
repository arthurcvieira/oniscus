# Oniscus: greetd runs the tuigreet terminal greeter on tty2.
# tuigreet lists only the Oniscus session (XFCE with i3); to offer plain i3 as
# well, point --xsessions to /usr/share/xsessions.
# The Linux console has 16 colors, so the theme uses color names.

[terminal]
vt = 2

[default_session]
command = "tuigreet --time --time-format '%a %d %b  %H:%M' --remember --remember-session --asterisks --window-padding 1 --container-padding 2 --greeting 'Oniscus live: user live, password live' --sessions /usr/share/oniscus/wayland-sessions --xsessions /usr/share/oniscus/xsessions --theme 'border=yellow;title=yellow;greet=white;prompt=yellow;input=white;time=yellow;action=gray;button=yellow;container=black;text=white'"
user = "greeter"
