# Undo the live-only settings on the installed system.
---
dontChroot: false
timeout: 900
script:
  - "-userdel -r live"
  - "-rm -f /etc/sudoers.d/10-live"
  - "-sed -i 's/^initial_info_text = .*/initial_info_text = welcome to Oniscus/' /etc/ly/config.ini"
  - "-rm -f /usr/share/applications/oniscus-install.desktop"
  - "-sh -c 'if [ -f /usr/lib/systemd/system/ly@.service ]; then systemctl enable ly@tty2.service; else systemctl enable ly.service; fi'"
  - "-systemctl disable getty@tty2.service"
  - "-rm -f /usr/local/bin/oniscus-install"
  - "-rm -f /etc/ly/save.txt /etc/ly/save.ini"
  # The copied system still has the live ISO's boot files: drop the live
  # initrd module and build a normal initrd for the installed kernel(s)
  - "-sh -c 'rm -f /etc/dracut.conf.d/*kiwi*'"
  - "-rpm -e --nodeps dracut-kiwi-live"
  - "dracut --force --no-hostonly --regenerate-all"
