# Optional NVIDIA driver. Nothing is selected by default, and the ISO itself
# never ships the driver: choosing it adds NVIDIA's official repository for
# openSUSE and installs the recommended driver while the system is installed.
---
mode: optional
method: legacy
labels:
  step: "Graphics driver"
  step[pt_BR]: "Driver de vídeo"
items:
  - id: nvidia
    name: "NVIDIA driver (official repository)"
    name[pt_BR]: "Driver NVIDIA (repositório oficial)"
    description: "Adds the official NVIDIA repository for openSUSE Tumbleweed and installs the recommended proprietary driver. Needs an internet connection. Choose it only if this computer has an NVIDIA graphics card."
    description[pt_BR]: "Adiciona o repositório oficial da NVIDIA para o openSUSE Tumbleweed e instala o driver proprietário recomendado. Precisa de internet. Escolha só se este computador tiver placa de vídeo NVIDIA."
