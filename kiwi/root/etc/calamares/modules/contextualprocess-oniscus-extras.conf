# Runs inside the installed system, based on the choices made in the
# "Graphics driver" and "Media codecs" steps. A failure here doesn't stop the
# installation (the leading "-"); the user can retry later with onis.
---
dontChroot: false
timeout: 1800

packagechooser_nvidia:
  nvidia:
    - "-zypper --non-interactive --gpg-auto-import-keys install openSUSE-repos-Tumbleweed-NVIDIA"
    - "-zypper --non-interactive --gpg-auto-import-keys refresh"
    - "-zypper --non-interactive --gpg-auto-import-keys install-new-recommends --repo repo-non-free"

packagechooser_codecs:
  packman:
    - "-zypper --non-interactive addrepo --refresh --priority 90 https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/ packman"
    - "-zypper --non-interactive --gpg-auto-import-keys refresh packman"
    - "-zypper --non-interactive --gpg-auto-import-keys dist-upgrade --from packman --allow-vendor-change"
    - "-zypper --non-interactive install --from packman gstreamer-plugins-good gstreamer-plugins-bad gstreamer-plugins-ugly gstreamer-plugins-libav vlc-codecs"
