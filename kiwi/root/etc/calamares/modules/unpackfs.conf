# Copy the running live system to the target disk. oniscus-install bind-mounts /
# at /run/oniscus-root first, so the copy does not see /proc, /sys and the like.
---
unpack:
  - source: "/run/oniscus-root"
    sourcefs: "file"
    destination: ""
    exclude: [ "/proc/*", "/sys/*", "/dev/*", "/run/*", "/tmp/*", "/mnt/*", "/media/*", "/home/live/*", "/etc/calamares/*" ]
