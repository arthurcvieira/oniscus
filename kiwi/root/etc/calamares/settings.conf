# Oniscus installer (Calamares). The live ISO boots in en_US / US keyboard / UTC;
# language, keyboard layout and time zone are chosen here during installation.
---
modules-search: [ local, /usr/lib/calamares/modules, /usr/lib64/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale        # language and time zone
      - keyboard      # keyboard layout
      - partition
      - users
      - packagechooser@nvidia   # optional, unchecked: official NVIDIA repository
      - packagechooser@codecs   # optional, unchecked: Packman multimedia codecs
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@oniscus-cleanup
      - contextualprocess@oniscus-extras
      - bootloader
      - umount
  - show:
      - finished

instances:
  - id: oniscus-cleanup
    module: shellprocess
    config: shellprocess-oniscus-cleanup.conf
  - id: nvidia
    module: packagechooser
    config: packagechooser-nvidia.conf
  - id: codecs
    module: packagechooser
    config: packagechooser-codecs.conf
  - id: oniscus-extras
    module: contextualprocess
    config: contextualprocess-oniscus-extras.conf

branding: oniscus
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
hide-back-and-next-during-exec: true
